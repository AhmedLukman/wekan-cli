                    schema: {type: file}
                    x-wekan-alternate-error-schema: {type: string}
                '400': {description: Invalid token length.}
                '401': {description: Invalid login token.}
                '403': {description: Board access denied.}
                '404': {description: 'Board, list or card not found.'}
                '500': {description: Workbook generation failed.}
            parameters:
                - {name: board, in: path, type: string, required: true}
                - {name: list, in: path, type: string, required: true}
                - {name: card, in: path, type: string, required: true}
                - {name: authToken, in: query, type: string, required: false}
                - {name: fields, in: query, type: string, required: false}
                - {name: lang, in: query, type: string, required: false}
                - {name: dateFormat, in: query, type: string, required: false}
