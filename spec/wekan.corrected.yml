    /api/boards/{board}/exportZip:
        get:
            operationId: exportZip
            summary: Export as a .zip - the JSON document, and the attachments as files.
            description: |-
                Intended to stream a ZIP containing wekan.json and attachment files. In the pinned v11.06 image this route currently fails with HTTP 500 before archive creation because the bundled archiver import is not callable.
            tags:
                - Boards
            produces:
                - application/zip
            security:
                - UserSecurity: []
                - {}
            responses:
                '200':
                    description: |-
                        ZIP archive.
                    schema: {type: file}
                '400': {description: Invalid token length., schema: {$ref: '#/definitions/ErrorResponse'}}
                '401': {description: Invalid login token., schema: {$ref: '#/definitions/ErrorResponse'}}
                '403': {description: Export disabled or board access denied., schema: {$ref: '#/definitions/ErrorResponse'}}
                '404': {description: Board not found., schema: {$ref: '#/definitions/ErrorResponse'}}
                '500':
                    description: >-
                        Pinned v11.06 runtime defect: archive construction throws before the ZIP response is created.
            parameters:
                - {name: board, in: path, type: string, required: true}
                - {name: authToken, in: query, type: string, required: false}
                - {name: fields, in: query, type: string, required: false, description: Comma-separated export sections.}
                - {name: swimlaneId, in: query, type: string, required: false}
                - {name: listId, in: query, type: string, required: false}
                - {name: cardId, in: query, type: string, required: false}
                - {name: checklistId, in: query, type: string, required: false}
            x-wekan-v11.06-defect: archiver-commonjs-interop
