    /api/boards/{board}/exportExcel:
        get:
            operationId: exportExcel
            summary: This route is used to export the board Excel.
            description: |
                If user is already logged-in, pass loginToken as param
                 "authToken": '/api/boards/:boardId/exportExcel?authToken=:token'

                 See https://blog.kayla.com.au/server-side-route-authentication-in-meteor/
                 for detailed explanations
            tags:
                - Boards
            security:
                - UserSecurity: []
                - {}
            responses:
                '200':
                    description: |-
                        XLSX workbook on success. Wekan v11.06 also returns plain-text missing-board, overlong-token, and authorization failures with HTTP 200.
                    schema: {type: file}
                    x-wekan-alternate-error-schema: {type: string}
                '401': {description: Invalid login token.}
                '500': {description: Workbook generation failed.}
            parameters:
                - {name: board, in: path, type: string, required: true}
                - {name: authToken, in: query, type: string, required: false}
                - {name: fields, in: query, type: string, required: false}
                - {name: lang, in: query, type: string, required: false}
                - {name: dateFormat, in: query, type: string, required: false}
                - {name: tz, in: query, type: string, required: false, description: 'IANA timezone name, at most 64 characters.'}
                - {name: swimlaneId, in: query, type: string, required: false}
                - {name: listId, in: query, type: string, required: false}
                - {name: cardId, in: query, type: string, required: false}
                - {name: checklistId, in: query, type: string, required: false}
            produces: [application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, text/plain]
            x-wekan-v11.06-defect: binary-export-errors-use-http-200
