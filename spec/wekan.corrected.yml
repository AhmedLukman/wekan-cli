                '400':
                    description: Target card/board/list/swimlane mismatch
                '401':
                    description: Missing or invalid authentication
                '403':
                    description: Not a member of source or target board, or attachments not allowed
                '404':
                    description: Source attachment, target card, or stored file not found
                '408': {description: JSON body stream was already consumed by global middleware., schema: {$ref: '#/definitions/ErrorResponse'}}
                '500': {description: Attachment insertion fails after the body-parser defect is removed., schema: {$ref: '#/definitions/ErrorResponse'}}
