    /api/import/zip:
        post:
            operationId: importZip
            summary: Import a .zip export - the document and its attachment files.
            description: |
                POST the .zip as the request body. Takes the same `fields`,
                 `swimlaneId`, `listId`, `cardId` and `checklistId` parameters as the
                 exports: with one of those ids it imports beside that thing, without one it
                 imports the whole document into the board named by `boardId`.
            tags:
                - Boards
            consumes:
                - application/zip
                - application/octet-stream
            parameters:
                - name: archive
                  in: body
                  description: Wekan ZIP export streamed as the complete request body.
                  required: true
                  schema:
                    type: string
                    format: binary
                - name: boardId
                  in: query
                  description: ID of the existing board to import into.
                  required: true
                  type: string
                - name: authToken
                  in: query
                  description: Login token alternative to the Authorization bearer header.
                  required: false
                  type: string
                - name: fields
                  in: query
                  description: Comma-separated export sections to retain during import.
                  required: false
                  type: string
                - name: swimlaneId
                  in: query
                  description: Import beside this swimlane.
                  required: false
                  type: string
                - name: listId
                  in: query
                  description: Import beside this list.
                  required: false
                  type: string
                - name: cardId
                  in: query
                  description: Import beside this card.
                  required: false
                  type: string
                - name: checklistId
                  in: query
                  description: Import beside this checklist.
                  required: false
                  type: string
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        Import completed.
                    schema:
                        type: object
                        required:
                            - ok
                            - counts
                        properties:
                            ok:
                                type: boolean
                            counts:
                                type: object
                                additionalProperties: true
                '400':
                    description: Bad request, invalid token length, or invalid Wekan export.
                '401':
                    description: Invalid login token.
                '403':
                    description: Authentication, board access, or import-setting rejection.
                '404':
                    description: Target board not found.
                '413':
                    description: ZIP exceeds WEKAN_IMPORT_ZIP_MAX_BYTES.
                '500':
                    description: Import failed.
