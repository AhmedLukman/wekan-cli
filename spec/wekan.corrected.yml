                  schema:
                    type: object
                    required:
                        - attachmentId
                        - targetBoardId
                        - targetSwimlaneId
                        - targetListId
                        - targetCardId
                    properties:
                        attachmentId:
                            type: string
                            description: ID of the source attachment
                        targetBoardId:
                            type: string
                        targetSwimlaneId:
                            type: string
                        targetListId:
                            type: string
                        targetCardId:
                            type: string
            responses:
                '200':
                    description: Attachment copied (newAttachmentId returned)
