                '401': {description: Invalid login token., schema: {$ref: '#/definitions/ErrorResponse'}}
                '403': {description: Export disabled or board access denied., schema: {$ref: '#/definitions/ErrorResponse'}}
                '404': {description: Board not found., schema: {$ref: '#/definitions/ErrorResponse'}}
