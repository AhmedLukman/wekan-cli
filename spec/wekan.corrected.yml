definitions:
    AttachmentStorageSettings:
        type: object
        properties:
            defaultStorage:
                type: string
                enum:
                    - fs
                    - gridfs
                    - s3
                    - azure
                    - gcs
            storageConfig:
                $ref: "#/definitions/AttachmentStorageSettingsStorageconfig"
                x-nullable: true
            uploadSettings:
                $ref: "#/definitions/AttachmentStorageSettingsUploadsettings"
                x-nullable: true
            limitSettings:
                $ref: "#/definitions/AttachmentStorageSettingsLimitsettings"
                x-nullable: true
            migrationSettings:
                $ref: "#/definitions/AttachmentStorageSettingsMigrationsettings"
                x-nullable: true
            createdAt:
                type: string
            updatedAt:
                type: string
            createdBy:
                type: string
                x-nullable: true
            updatedBy:
                type: string
                x-nullable: true
        required:
            - defaultStorage
            - createdAt
            - updatedAt
    AttachmentStorageSettingsLimitsettings:
        type: object
        properties:
            attachmentsUploadMaxBytes:
                type: number
            attachmentsUploadBlocked:
                type: boolean
            avatarsUploadBlocked:
                type: boolean
            attachmentsDownloadMaxBytes:
                type: number
            attachmentsDownloadBlocked:
                type: boolean
            apiUploadMaxBytes:
                type: number
            apiUploadBlocked:
                type: boolean
            apiDownloadMaxBytes:
                type: number
            apiDownloadBlocked:
                type: boolean
    AttachmentStorageSettingsMigrationsettings:
        type: object
        properties:
            autoMigrate:
                type: boolean
            batchSize:
                type: number
            delayMs:
                type: number
            cpuThreshold:
                type: number
        required:
            - autoMigrate
            - batchSize
            - delayMs
            - cpuThreshold
    AttachmentStorageSettingsStorageconfig:
        type: object
        properties:
            filesystem:
                $ref: "#/definitions/AttachmentStorageSettingsStorageconfigFilesystem"
            gridfs:
                $ref: "#/definitions/AttachmentStorageSettingsStorageconfigGridfs"
            s3:
                type: object
                description: >-
                    Provider-specific S3-compatible configuration; intentionally black-box in Wekan v11.06 models/attachmentStorageSettings.js lines 92-99.
                additionalProperties: true
            azure:
                type: object
                description: >-
                    Provider-specific Azure configuration; intentionally black-box in Wekan v11.06 models/attachmentStorageSettings.js lines 101-107.
                additionalProperties: true
            gcs:
                type: object
                description: >-
                    Provider-specific Google Cloud configuration; intentionally black-box in Wekan v11.06 models/attachmentStorageSettings.js lines 109-115.
                additionalProperties: true
    AttachmentStorageSettingsStorageconfigFilesystem:
        type: object
        properties:
            enabled:
                type: boolean
            read:
                type: boolean
            write:
                type: boolean
            path:
                type: string
        required:
            - enabled
            - read
            - write
    AttachmentStorageSettingsStorageconfigGridfs:
        type: object
        properties:
            enabled:
                type: boolean
            read:
                type: boolean
            write:
                type: boolean
        required:
            - enabled
            - read
            - write
    AttachmentStorageSettingsUploadsettings:
        type: object
        properties:
            maxFileSize:
                type: number
            allowedMimeTypes:
                type: array
                items:
                    type: string
                    x-nullable: true
    AttachmentStorageSettingsUploadsettingsAllowedmimetypes:
        type: array
        description: >-
            MIME-type string array declared by Wekan v11.06 models/attachmentStorageSettings.js lines 130-138.
        items: {type: string}
    CardComments:
        type: object
        description: A comment on a card
        properties:
            boardId:
                description: |
                    the board ID
                type: string
            cardId:
                description: |
                    the card ID
                type: string
            text:
                description: |
                    the text of the comment
                type: string
            parentId:
                description: |
                    the _id of the comment this comment is a reply to (threaded replies).
                    Optional: top-level comments have no parentId.
                type: string
                x-nullable: true
            createdAt:
                description: |
                    when was the comment created
                type: string
            modifiedAt:
                type: string
            userId:
                description: |
                    the author ID of the comment
                type: string
        required:
            - boardId
            - cardId
            - text
            - createdAt
            - modifiedAt
            - userId
    Cards:
        type: object
        properties:
            title:
                description: |
                    the title of the card
                type: string
                x-nullable: true
            archived:
                description: |
                    is the card archived
                type: boolean
            archivedAt:
                description: |
                    latest archiving date
                type: string
                x-nullable: true
            deletedAt:
                type: string
                x-nullable: true
            deletedBy:
                type: string
                x-nullable: true
            deleteBatchId:
                type: string
                x-nullable: true
            parentId:
                description: |
                    ID of the parent card
                type: string
                x-nullable: true
