                        - targetListId
                        - targetCardId
                    properties:
                        attachmentId:
                            type: string
                            description: ID of the attachment to move
                        targetBoardId:
                            type: string
                        targetSwimlaneId:
                            type: string
                        targetListId:
                            type: string
                        targetCardId:
                            type: string
            responses:
                '200':
