swagger: '2.0'
info:
    title: Wekan REST API
    version: v11.06
    description: |
        The REST API allows you to control and extend Wekan with ease.

        If you are an end-user and not a dev or a tester, [create an issue](https://github.com/wekan/wekan/issues/new) to request new APIs.

        > All API calls in the documentation are made using `curl`.  However, you are free to use Java / Python / PHP / Golang / Ruby / Swift / Objective-C / Rust / Scala / C# or any other programming languages.

        # Production Security Concerns
        When calling a production Wekan server, ensure it is running via HTTPS and has a valid SSL Certificate. The login method requires you to post your username and password in plaintext, which is why we highly suggest only calling the REST login api over HTTPS. Also, few things to note:

        * Only call via HTTPS
        * Implement a timed authorization token expiration strategy
        * Ensure the calling user only has permissions for what they are calling and no more
securityDefinitions:
    UserSecurity:
        type: apiKey
        in: header
        name: Authorization
paths:
    /users/login:
        post:
            operationId: login
            summary: Login with REST API
            tags:
                - Login
            responses:
                200:
                    description: |-
                        Authenticated; a new login token was created.
                    schema:
                        $ref: '#/definitions/AuthTokenResponse'
                400:
                    description: |-
                        The request body could not be parsed.
                    schema:
                        $ref: '#/definitions/ErrorResponse'
                default:
                    description: |
                        Error in authentication
                '401':
                    description: Invalid request shape, credentials, or two-factor code.
                    schema:
                        $ref: '#/definitions/ErrorResponse'
                '429':
                    description: Too many failed attempts. The Retry-After header gives seconds.
                    headers:
                        Retry-After:
                            type: integer
                            format: int32
                            description: Seconds until another login attempt is allowed.
                    schema:
                        $ref: '#/definitions/ErrorResponse'
            consumes:
                - application/json
            parameters:
                - name: loginRequest
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/LoginRequest'
    /users/register:
        post:
            operationId: register
            summary: Register with REST API
            description: |
                Notes:
                  - You will need to provide the token for any of the authenticated methods.
            tags:
                - Login
            responses:
                200:
                    description: |-
                        Account created and authenticated.
                    schema:
                        $ref: '#/definitions/AuthTokenResponse'
                400:
                    description: |-
                        Invalid registration request.
                    schema:
                        $ref: '#/definitions/ErrorResponse'
                default:
                    description: |
                        Error in registration
                '403':
                    description: Registration is disabled.
                    schema:
                        $ref: '#/definitions/ErrorResponse'
            consumes:
                - application/json
                - application/x-www-form-urlencoded
            parameters:
                - name: registrationRequest
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/RegisterRequest'
    /api/admin/attachment-settings:
        get:
            operationId: get_attachment_settings
            summary: Get the attachment storage / upload-block settings (GlobalAdmin)
            description: |
                Only the global admin can call this. Returns the Admin Panel >
                 Attachments settings document, including `limitSettings.attachmentsUploadBlocked`
                 and `limitSettings.avatarsUploadBlocked` plus the size limits. Cloud-storage
                 secret keys (S3 secretAccessKey, Azure accountKey/connectionString, GCS
                 credentials) are masked and never returned; a boolean `<field>Set` marker
                 shows whether a value exists.
            tags:
                - AttachmentStorageSettings
                - Settings
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        Masked attachment storage settings or serialized application error.
                    schema:
                        $ref: '#/definitions/AttachmentStorageSettings'
        put:
            operationId: update_attachment_settings
            summary: Update the attachment storage / upload-block settings (GlobalAdmin)
            description: |-
                Partial attachment-storage settings update.
            tags:
                - AttachmentStorageSettings
                - Settings
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        Masked updated attachment settings or serialized application error.
                    schema:
                        $ref: '#/definitions/AttachmentStorageSettings'
            consumes: [application/json]
            parameters:
                - name: settings
                  in: body
                  required: false
                  schema:
                    $ref: '#/definitions/AttachmentStorageSettingsUpdate'
    /api/admin/domains:
        get:
            operationId: get_admin_domains
            summary: List email domains with their user counts (GlobalAdmin)
            description: |
                Only the global admin can call this. Counts every user by the
                 domain part of their primary email address (the first address in `emails`),
                 mirroring the Admin Panel > People domain grouping. Domains are returned
                 sorted by descending count, then alphabetically.
            tags:
                - Users
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema:
                        type: array
                        items:
                            type: object
                            properties:
                                domain:
                                    type: string
                                count:
                                    type: number
    /api/admin/orgs:
        get:
            operationId: get_admin_orgs
            summary: List organizations with their feature toggles (GlobalAdmin)
            description: |
                Only the global admin can call this. Returns every organization
                 with its identifying fields and the per-org feature toggles shown as columns
                 in Admin Panel > People > Organizations.
            tags:
                - Org
                - Organizations
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema:
                        type: array
                        items:
                            type: object
                            properties:
                                _id:
                                    type: string
                                orgDisplayName:
                                    type: string
                                orgShortName:
                                    type: string
                                orgSharedTemplates:
                                    type: boolean
                                orgPropagateMembersToBoards:
                                    type: boolean
                                orgSyncMembersFromAuth:
                                    type: boolean
    /api/admin/orgs/{org}/features:
        put:
            operationId: update_admin_org_features
            summary: Set feature toggles on one organization (GlobalAdmin)
            description: |
                Only the global admin can call this. The request body may
                 contain any of `orgSharedTemplates`, `orgPropagateMembersToBoards` and
                 `orgSyncMembersFromAuth` (booleans); only those whitelisted fields are
                 `$set` on the organization. Returns the updated organization.
            tags:
                - Org
                - Organizations
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        Updated organization or serialized application error.
                    schema:
                        $ref: '#/definitions/Org'
            consumes: [application/json]
            parameters:
                - {name: org, in: path, type: string, required: true}
                - name: features
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/OrgFeatureRequest'
    /api/admin/orgs/features:
        put:
            operationId: update_all_admin_org_features
            summary: Set one feature toggle on all organizations (GlobalAdmin)
            description: |
                Only the global admin can call this. The request body is
                 `{ field, value }` where `field` is one of `orgSharedTemplates`,
                 `orgPropagateMembersToBoards` or `orgSyncMembersFromAuth` and `value` is a
                 boolean. The field is `$set` on ALL organizations. Returns the number of
                 organizations updated.
            tags:
                - Org
                - Organizations
            consumes:
                - multipart/form-data
                - application/json
            parameters:
                - name: feature
                  in: body
                  required: true
                  schema:
                    type: object
                    required:
                        - field
                    properties:
                        field:
                            type: string
                            enum:
                                - orgSharedTemplates
                                - orgPropagateMembersToBoards
                                - orgSyncMembersFromAuth
                        value:
                            type: boolean
                            description: Missing or false-like values are stored as false.
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        Updated organization count, invalid-field error, or serialized application error.
                    schema:
                        $ref: '#/definitions/FeatureUpdateResult'
    /api/admin/teams:
        get:
            operationId: get_admin_teams
            summary: List teams with their feature toggles (GlobalAdmin)
            description: |
                Only the global admin can call this. Returns every team with
                 its identifying fields and the per-team feature toggles shown as columns in
                 Admin Panel > People > Teams.
            tags:
                - Team
                - Teams
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema:
                        type: array
                        items:
                            type: object
                            properties:
                                _id:
                                    type: string
                                teamDisplayName:
                                    type: string
                                teamShortName:
                                    type: string
                                teamSharedTemplates:
                                    type: boolean
                                teamPropagateMembersToBoards:
                                    type: boolean
                                teamSyncMembersFromAuth:
                                    type: boolean
    /api/admin/teams/{team}/features:
        put:
            operationId: update_admin_team_features
            summary: Set feature toggles on one team (GlobalAdmin)
            description: |
                Only the global admin can call this. The request body may
                 contain any of `teamSharedTemplates`, `teamPropagateMembersToBoards` and
                 `teamSyncMembersFromAuth` (booleans); only those whitelisted fields are
                 `$set` on the team. Returns the updated team.
            tags:
                - Team
                - Teams
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        Updated team or serialized application error.
                    schema:
                        $ref: '#/definitions/Team'
            consumes: [application/json]
            parameters:
                - {name: team, in: path, type: string, required: true}
                - name: features
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/TeamFeatureRequest'
    /api/admin/teams/features:
        put:
            operationId: update_all_admin_team_features
            summary: Set one feature toggle on all teams (GlobalAdmin)
            description: |
                Only the global admin can call this. The request body is
                 `{ field, value }` where `field` is one of `teamSharedTemplates`,
                 `teamPropagateMembersToBoards` or `teamSyncMembersFromAuth` and `value` is a
                 boolean. The field is `$set` on ALL teams. Returns the number of teams
                 updated.
            tags:
                - Team
                - Teams
            consumes:
                - multipart/form-data
                - application/json
            parameters:
                - name: feature
                  in: body
                  required: true
                  schema:
                    type: object
                    required:
                        - field
                    properties:
                        field:
                            type: string
                            enum:
                                - teamSharedTemplates
                                - teamPropagateMembersToBoards
                                - teamSyncMembersFromAuth
                        value:
                            type: boolean
                            description: Missing or false-like values are stored as false.
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        Updated team count, invalid-field error, or serialized application error.
                    schema:
                        $ref: '#/definitions/FeatureUpdateResult'
    /api/boards/{board}/attachments/{attachment}/export:
        get:
            operationId: exportAttachmentJson
            summary: This route is used to export a attachement to a json file format.
            description: |-
                Public boards require no authentication. For a private board, pass a permitted user's login token as the authToken query parameter. In Wekan v11.06, an Authorization bearer token works only for a global administrator.
            tags:
                - Boards
            produces:
                - application/json
            security:
                - UserSecurity: []
                - {}
            responses:
                '200':
                    description: |-
                        Wekan export document containing the selected attachment.
                    schema: {type: object, additionalProperties: true}
                '400': {description: Invalid token length., schema: {$ref: '#/definitions/ErrorResponse'}}
                '401': {description: Invalid login token., schema: {$ref: '#/definitions/ErrorResponse'}}
                '403': {description: Board access denied., schema: {$ref: '#/definitions/ErrorResponse'}}
                '404': {description: Board not found., schema: {$ref: '#/definitions/ErrorResponse'}}
            parameters:
                - {name: board, in: path, type: string, required: true}
                - {name: attachment, in: path, type: string, required: true}
                - {name: authToken, in: query, type: string, required: false}
    /api/boards/{board}/cards/{card}/checklists:
        get:
            operationId: get_board_card_checklists
            tags:
                - Checklists
            parameters:
                - name: board
                  in: path
                  description: the board value
                  type: string
                  required: true
                - name: card
                  in: path
                  description: the card value
                  type: string
                  required: true
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema: {type: array, items: {$ref: '#/definitions/ChecklistSummary'}}
        post:
            operationId: post_board_card_checklists
            tags:
                - Checklists
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        Checklist created.
                    schema: {$ref: '#/definitions/IdResponse'}
                '400': {description: Checklist could not be created., schema: {$ref: '#/definitions/ErrorResponse'}}
                '404': {description: Card not found on this board., schema: {$ref: '#/definitions/ErrorResponse'}}
            consumes: [application/json]
            parameters:
                - {name: board, in: path, type: string, required: true}
                - {name: card, in: path, type: string, required: true}
                - name: request
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChecklistCreateRequest'
    /api/boards/{board}/cards/{card}/checklists/{checklist}:
        get:
            operationId: get_board_card_checklist
            tags:
                - Checklists
            parameters:
                - name: board
                  in: path
                  description: the board value
                  type: string
                  required: true
                - name: card
                  in: path
                  description: the card value
                  type: string
                  required: true
                - name: checklist
                  in: path
                  description: the checklist value
                  type: string
                  required: true
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema: {$ref: '#/definitions/ChecklistDetail'}
        delete:
            operationId: delete_board_card_checklist
            tags:
                - Checklists
            parameters:
                - name: board
                  in: path
                  description: the board value
                  type: string
                  required: true
                - name: card
                  in: path
                  description: the card value
                  type: string
                  required: true
                - name: checklist
                  in: path
                  description: the checklist value
                  type: string
                  required: true
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema: {$ref: '#/definitions/IdResponse'}
    /api/boards/{board}/cards/{card}/checklists/{checklist}/items:
        post:
            operationId: post_board_card_checklist_items
            tags:
                - ChecklistItems
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        Checklist item created.
                    schema: {$ref: '#/definitions/IdResponse'}
                '404': {description: Card or checklist not found., schema: {$ref: '#/definitions/ErrorResponse'}}
            consumes: [application/json]
            parameters:
                - {name: board, in: path, type: string, required: true}
                - {name: card, in: path, type: string, required: true}
                - {name: checklist, in: path, type: string, required: true}
                - name: request
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChecklistItemCreateRequest'
    /api/boards/{board}/cards/{card}/checklists/{checklist}/items/{item}:
        get:
            operationId: get_board_card_checklist_item
            tags:
                - ChecklistItems
            parameters:
                - name: board
                  in: path
                  description: the board value
                  type: string
                  required: true
                - name: card
                  in: path
                  description: the card value
                  type: string
                  required: true
                - name: checklist
                  in: path
                  description: the checklist value
                  type: string
                  required: true
                - name: item
                  in: path
                  description: the item value
                  type: string
                  required: true
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema: {$ref: '#/definitions/ChecklistItems'}
        put:
            operationId: put_board_card_checklist_item
            tags:
                - ChecklistItems
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        Checklist item updated.
                    schema: {$ref: '#/definitions/IdResponse'}
                '404': {description: 'Card, checklist, or item not found.', schema: {$ref: '#/definitions/ErrorResponse'}}
            consumes: [application/json]
            parameters:
                - {name: board, in: path, type: string, required: true}
                - {name: card, in: path, type: string, required: true}
                - {name: checklist, in: path, type: string, required: true}
                - {name: item, in: path, type: string, required: true}
                - name: changes
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ChecklistItemUpdateRequest'
        delete:
            operationId: delete_board_card_checklist_item
            tags:
                - ChecklistItems
            parameters:
                - name: board
                  in: path
                  description: the board value
                  type: string
                  required: true
                - name: card
                  in: path
                  description: the card value
                  type: string
                  required: true
                - name: checklist
                  in: path
                  description: the checklist value
                  type: string
                  required: true
                - name: item
                  in: path
                  description: the item value
                  type: string
                  required: true
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema: {$ref: '#/definitions/IdResponse'}
    /api/boards/{board}/cards/{card}/comments:
        get:
            operationId: get_board_card_comments
            tags:
                - CardComments
            parameters:
                - name: board
                  in: path
                  description: the board value
                  type: string
                  required: true
                - name: card
                  in: path
                  description: the card value
                  type: string
                  required: true
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema: {type: array, items: {$ref: '#/definitions/CommentSummary'}}
        post:
            operationId: post_board_card_comments
            tags:
                - CardComments
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        Comment created.
                    schema: {$ref: '#/definitions/IdResponse'}
                '400': {description: Missing or empty comment., schema: {$ref: '#/definitions/ErrorResponse'}}
            consumes: [application/json]
            parameters:
                - {name: board, in: path, type: string, required: true}
                - {name: card, in: path, type: string, required: true}
                - name: request
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CommentCreateRequest'
    /api/boards/{board}/cards/{card}/comments/{comment}:
        get:
            operationId: get_board_card_comment
            tags:
                - CardComments
            parameters:
                - name: board
                  in: path
                  description: the board value
                  type: string
                  required: true
                - name: card
                  in: path
                  description: the card value
                  type: string
                  required: true
                - name: comment
                  in: path
                  description: the comment value
                  type: string
                  required: true
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema: {$ref: '#/definitions/CardComments'}
        delete:
            operationId: delete_board_card_comment
            tags:
                - CardComments
            parameters:
                - name: board
                  in: path
                  description: the board value
                  type: string
                  required: true
                - name: card
                  in: path
                  description: the card value
                  type: string
                  required: true
                - name: comment
                  in: path
                  description: the comment value
                  type: string
                  required: true
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema: {$ref: '#/definitions/IdResponse'}
    /api/boards/{board}/cards/{card}/dependencies:
        get:
            operationId: get_card_dependencies
            summary: Get one card's dependencies
            tags:
                - Dependencies
            parameters:
                - name: board
                  in: path
                  description: |
                    the board ID
                  type: string
                  required: true
                - name: card
                  in: path
                  description: |
                    the card ID
                  type: string
                  required: true
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema:
                        type: array
                        items:
                            type: object
                            properties:
                                cardId:
                                    type: string
                                type:
                                    type: string
                                color:
                                    type: string
                                icon:
                                    type: string
        post:
            operationId: new_card_dependency
            summary: Add (or update) a typed dependency line from a card to another card
            description: |
                The target card must be on the same board. If the dependency
                 already exists, its type/color/icon are updated.
            tags:
                - Dependencies
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema:
                        type: object
                        properties:
                            _id:
                                type: string
                            cardId:
                                type: string
                            type:
                                type: string
                            color:
                                type: string
                            icon:
                                type: string
            consumes: [application/json]
            parameters:
                - {name: board, in: path, type: string, required: true}
                - {name: card, in: path, type: string, required: true}
                - name: dependency
                  in: body
                  required: true
                  schema: {$ref: '#/definitions/DependencyCreateRequest'}
    /api/boards/{board}/cards/{card}/dependencies/{target}:
        put:
            operationId: edit_card_dependency
            summary: Edit a dependency line's type, color or icon
            tags:
                - Dependencies
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema:
                        type: object
                        properties:
                            _id:
                                type: string
            consumes: [application/json]
            parameters:
                - {name: board, in: path, type: string, required: true}
                - {name: card, in: path, type: string, required: true}
                - {name: target, in: path, type: string, required: true}
                - name: changes
                  in: body
                  required: true
                  schema: {$ref: '#/definitions/DependencyUpdateRequest'}
        delete:
            operationId: delete_card_dependency
            summary: Remove a dependency line from a card
            tags:
                - Dependencies
            parameters:
                - name: board
                  in: path
                  description: |
                    the board ID
                  type: string
                  required: true
                - name: card
                  in: path
                  description: |
                    the source card ID
                  type: string
                  required: true
                - name: target
                  in: path
                  description: |
                    the target card ID of the dependency to remove
                  type: string
                  required: true
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        200 response
                    schema:
                        type: object
                        properties:
                            _id:
                                type: string
    /api/boards/{board}/cards/bulk:
        delete:
            operationId: delete_board_cards_bulk
            tags:
                - Cards
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        Deleted and unmatched card IDs.
                    schema:
                        type: object
                        required: [deleted, notFound]
                        properties:
                            deleted: {type: array, items: {type: string}}
                            notFound: {type: array, items: {type: string}}
                '400': {description: Card ID array is empty or exceeds 500., schema: {$ref: '#/definitions/ErrorResponse'}}
            consumes: [application/json]
            parameters:
                - {name: board, in: path, type: string, required: true}
                - name: request
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CardIdsRequest'
    /api/boards/{board}/cards/labels:
        post:
            operationId: post_board_cards_labels
            tags:
                - Cards
            produces:
                - application/json
            security:
                - UserSecurity: []
            responses:
                '200':
                    description: |-
                        Updated cards and unmatched IDs.
                    schema:
                        type: object
                        required: [updated, notFound]
                        properties:
                            updated: {type: array, items: {type: object, additionalProperties: true}}
