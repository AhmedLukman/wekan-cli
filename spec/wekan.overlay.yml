  # Overlay 1.1 recursively merges mappings. Remove inherited inline response
  # schemas before installing definition references so the generated schema
  # does not retain ignored/conflicting `type`, `properties`, or `items` beside
  # `$ref`.
  - target: '$.paths["/users/login"].post.responses["200"].schema'
    description: Remove the generated inline login-success schema before replacing it with AuthTokenResponse.
    remove: true
  - target: '$.paths["/users/login"].post.responses["400"].schema'
    description: Remove the generated inline login-error schema before replacing it with ErrorResponse.
    remove: true
  - target: '$.paths["/users/register"].post.responses["200"].schema'
    description: Remove the generated inline registration-success schema before replacing it with AuthTokenResponse.
    remove: true
  - target: '$.paths["/users/register"].post.responses["400"].schema'
    description: Remove the generated inline registration-error schema before replacing it with ErrorResponse.
    remove: true
  - target: '$.paths["/api/admin/orgs/features"].put.responses["200"].schema'
    description: Remove the generated inline bulk-organization result before replacing it with FeatureUpdateResult.
    remove: true
  - target: '$.paths["/api/admin/teams/features"].put.responses["200"].schema'
    description: Remove the generated inline bulk-team result before replacing it with FeatureUpdateResult.
    remove: true

  # Overlay 1.1 merges array updates. Remove the inherited HTTP-only array so
  # the exact replacement below does not produce [http, https, http].
  - target: '$.schemes'
    description: Remove the inherited scheme array before adding the sourced HTTPS and HTTP replacement.
    remove: true

  # Binary/text exporters inherit application/json from the generated
  # annotations. Remove those arrays before installing the exact response media
  # types below; Overlay 1.1 would otherwise append to them.
  - target: '$.paths["/api/boards/{board}/export/csv"].get.produces'
    description: Remove inherited JSON before adding the CSV and TSV media types.
    remove: true
