extends: ./wekan.yml

# Keep only correction deltas here; never copy the complete upstream snapshot.
# Every action cites matching-version implementation or test evidence.
actions:
  - target: '$'
    description: >-
      Record the two global request-body parsers installed by Wekan v11.06
      server/apiMiddleware.js lines 12-15. The matching v11.06 api.py exercises
      both encodings: for example JSON at lines 612-614 and URL-encoded data at
      lines 657-660. Operation schemas below use JSON as the canonical lossless
      representation, especially for arrays and nested objects.
    update:
      x-wekan-request-body-parsers:
        source: server/apiMiddleware.js lines 12-15
        acceptedMediaTypes:
          - application/json
          - application/x-www-form-urlencoded
        note: >-
          The operation-level JSON schemas are canonical. Wekan also globally
          parses URL-encoded bodies; api.py uses that compatibility path for
          legacy scalar requests, while nested objects and arrays should use JSON.

  # Overlay 1.1 `update` merges arrays. Remove the stale generated parameter
  # arrays first so the sourced replacements below do not coexist with the
  # incorrect upstream form fields or duplicate path parameters.
