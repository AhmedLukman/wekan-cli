overlay: 1.1.0
info:
  title: Verified corrections for Wekan v12.57
  version: 1.0.0
extends: ./wekan.yml
actions:
- target: $["definitions"]["CustomFields"]["properties"]["type"]["enum"]
  description: Wekan v12.57 models/customFields.js:32-40 uses the exact camelCase dropdownMultiSelect value;
    the upstream generator incorrectly lowercases it. Live tests/e2e/custom_fields.rs verifies creation,
    normal reads and native JSON exports.
  remove: true
- target: $["definitions"]["CustomFields"]["properties"]["type"]
  description: Restore the exact v12.57 enum after removing the generator's lowercased values.
  update:
    enum:
    - text
    - number
    - date
    - dropdown
    - dropdownMultiSelect
    - checkbox
    - currency
    - stringtemplate
- target: $["definitions"]["CustomFieldsSettings"]["properties"]
  description: Wekan v12.57 custom-field POST/GET preserves explicit null for each optional Jira setting;
    verified against models/customFields.js:49-53 and tests/e2e/custom_fields.rs.
  update:
    jiraTimeField:
      x-nullable: true
    jiraEstimateFieldId:
      x-nullable: true
    jiraEstimateUnit:
      x-nullable: true
- target: $["definitions"]["Boards"]["properties"]["color"]["enum"]
  description: Wekan v12.57 commit 647cbd111f43b4c936af2e03480f04cb8e2ef39e. The schema generator emits a null enum
    for a computed allowedValues constant; remove the invalid enum.
  remove: true
- target: $["definitions"]["Boards"]["properties"]["dateFormat"]["enum"]
  description: Wekan v12.57 commit 647cbd111f43b4c936af2e03480f04cb8e2ef39e. The schema generator emits a null enum
    for a computed allowedValues constant; remove the invalid enum.
  remove: true
- target: $["paths"]["/api/user"]["get"]
  description: Wekan v12.57 commit 647cbd111f43b4c936af2e03480f04cb8e2ef39e. Disambiguate the upstream duplicate
    operationId without changing its route.
  update:
    operationId: get_current_user
- target: $["paths"]["/api/boards/{board}/attachments/{attachment}/export"]["get"]
  description: Wekan v12.57 commit 647cbd111f43b4c936af2e03480f04cb8e2ef39e. Disambiguate the upstream duplicate
    operationId without changing its route.
  update:
    operationId: exportAttachmentJson
- target: $["paths"]["/api/boards/{board}/lists/{list}/cards/{card}/exportPDF"]["get"]
  description: Wekan v12.57 commit 647cbd111f43b4c936af2e03480f04cb8e2ef39e. Disambiguate the upstream duplicate
    operationId without changing its route.
  update:
    operationId: exportCardPDF
- target: $.paths
  description: Wekan v12.57 commit 647cbd111f43b4c936af2e03480f04cb8e2ef39e. server/apiAuthRoutes.js registers logout
    and three OPTIONS preflights; server/startupSchemaUpgrade.js registers public status; server/routes/importTrelloZip.js
    registers the native Trello HTTP import. The generator omits these route modules.
  update:
    /users/logout:
      post:
        operationId: logout
        summary: Revoke the current login token or all login tokens.
        tags:
        - Users
        parameters:
        - name: logoutRequest
          in: body
          required: false
          schema:
            $ref: '#/definitions/LogoutRequest'
        responses:
          '200':
            description: Token or tokens revoked.
            schema:
              $ref: '#/definitions/LogoutResponse'
          '401':
            description: Missing or invalid bearer token.
            schema:
              $ref: '#/definitions/ErrorResponse'
          '500':
            description: Logout failed.
            schema:
              $ref: '#/definitions/ErrorResponse'
          '400':
            description: Malformed JSON bodies return HTTP 400 HTML before route dispatch.
            schema:
              type: string
              pattern: ^<!DOCTYPE html>
          '413':
            description: JSON or URL-encoded bodies larger than 50 MiB return HTTP 413 HTML before route dispatch.
            schema:
              type: string
              pattern: ^<!DOCTYPE html>
        consumes:
        - application/json
        - application/x-www-form-urlencoded
        produces:
        - application/json
        - text/html
        security:
        - UserSecurity: []
        - AccessTokenSecurity: []
      options:
        operationId: options_logout
        summary: Authentication preflight
        description: Explicit empty HTTP 200 preflight. Wekan v12.57 server/apiAuthRoutes.js OPTIONS registrations;
          live tests/e2e/public_probes.rs.
        responses:
          '200':
            description: Empty response without a Content-Type header.
            x-wekan-empty-body: true
          '400':
            description: Malformed JSON bodies return HTTP 400 HTML before route dispatch.
            schema:
              type: string
              pattern: ^<!DOCTYPE html>
          '413':
            description: JSON or URL-encoded bodies larger than 50 MiB return HTTP 413 HTML before route dispatch.
            schema:
              type: string
              pattern: ^<!DOCTYPE html>
        produces:
        - application/json
        - text/html
        security: []
    /users/login:
      options:
        operationId: options_login
        summary: Authentication preflight
        description: Explicit empty HTTP 200 preflight. Wekan v12.57 server/apiAuthRoutes.js OPTIONS registrations;
          live tests/e2e/public_probes.rs.
        responses:
          '200':
            description: Empty response without a Content-Type header.
            x-wekan-empty-body: true
          '400':
            description: Malformed JSON bodies return HTTP 400 HTML before route dispatch.
            schema:
              type: string
              pattern: ^<!DOCTYPE html>
          '413':
            description: JSON or URL-encoded bodies larger than 50 MiB return HTTP 413 HTML before route dispatch.
            schema:
              type: string
              pattern: ^<!DOCTYPE html>
        produces:
        - application/json
        - text/html
        security: []
    /users/register:
      options:
        operationId: options_register
        summary: Authentication preflight
        description: Explicit empty HTTP 200 preflight. Wekan v12.57 server/apiAuthRoutes.js OPTIONS registrations;
          live tests/e2e/public_probes.rs.
        responses:
          '200':
            description: Empty response without a Content-Type header.
            x-wekan-empty-body: true
          '400':
            description: Malformed JSON bodies return HTTP 400 HTML before route dispatch.
            schema:
              type: string
              pattern: ^<!DOCTYPE html>
          '413':
            description: JSON or URL-encoded bodies larger than 50 MiB return HTTP 413 HTML before route dispatch.
            schema:
              type: string
              pattern: ^<!DOCTYPE html>
        produces:
        - application/json
        - text/html
        security: []
    /schema-upgrade-status:
      get:
        operationId: get_schema_upgrade_status
        tags:
        - Admin
        summary: Get live startup schema-upgrade status.
        description: Returns an HTML dashboard by default. Include the `json` query key (its value is ignored) to
          receive the raw JSON state. This public route is implemented by Wekan v12.57 server/startupSchemaUpgrade.js
          lines 30-67.
        parameters:
        - name: json
          in: query
          type: string
          required: false
          description: Presence selects the JSON response; the value is ignored.
        responses:
          '200':
            description: Schema-upgrade state when `json` is present; otherwise the HTML dashboard. The schema below
              describes the JSON variant.
            schema:
              $ref: '#/definitions/SchemaUpgradeState'
            x-wekan-alternate-error-schema:
              type: string
              description: HTML dashboard when the json query key is absent.
          '400':
            description: Malformed JSON bodies return HTTP 400 HTML before route dispatch.
            schema:
              type: string
              pattern: ^<!DOCTYPE html>
          '413':
            description: JSON or URL-encoded bodies larger than 50 MiB return HTTP 413 HTML before route dispatch.
            schema:
              type: string
              pattern: ^<!DOCTYPE html>
        produces:
        - application/json
        - text/html
        security:
        - {}
    /import-trello:
      post:
        operationId: import_trello
        summary: Import Trello boards from a JSON document or ZIP archive.
        description: JSON accepts {board,membersMapping} and returns {boardIds}; ZIP imports each recognized Trello
          board and returns {boardIds,errors}. ZIP board failures are collected without rolling back earlier boards
          and still return HTTP 200. JSON failures return HTTP 400; earlier writes are not rolled back. A failed
          board can remain persisted without its ID appearing in boardIds; the error names that board but does not
          identify the created resources (W11-060). ZIP member mapping is not supported. ZIP limits are 200 MiB
          compressed, 1 GiB declared uncompressed, 5000 files, and 100 MiB per declared file; unsafe archive paths
          are rejected. Global JSON parsing has a 50 MiB limit and malformed or oversized JSON produces middleware
          HTML errors. Authentication uses a Bearer token, X-Auth-Token, or login cookie; query tokens are not read.
          This route is outside the WITH_API gate and is distinct from /api/boards/import/trello and /api/import/zip.
        tags:
        - Boards
        consumes:
        - application/json
        - application/zip
        - application/octet-stream
        produces:
        - application/json
        - text/html
        security:
        - UserSecurity: []
        - TrelloImportXAuthToken: []
        - TrelloImportLoginCookie: []
        parameters:
        - name: importDocument
          in: body
          required: true
          schema:
            $ref: '#/definitions/TrelloHttpImportRequest'
        responses:
          '200':
            description: JSON returns boardIds without errors. ZIP returns boardIds and errors, including partial
              or complete per-board import failure.
            schema:
              $ref: '#/definitions/TrelloHttpImportResult'
          '400':
            description: JSON import or ZIP parsing/validation/read failure, as JSON {error}; malformed JSON instead
              produces a middleware HTML error.
            schema:
              x-oneOf:
              - $ref: '#/definitions/TrelloHttpImportError'
              - type: string
          '401':
            description: Missing or invalid login token.
            schema:
              $ref: '#/definitions/TrelloHttpImportError'
          '405':
            description: 'Non-POST requests return {error: method-not-allowed}.'
            schema:
              $ref: '#/definitions/TrelloHttpImportError'
          '413':
            description: Compressed ZIP upload exceeds 200 MiB, returning JSON {error} before destroying the request.
              Oversized JSON instead produces a middleware HTML error at the 50 MiB parser limit.
            schema:
              x-oneOf:
              - $ref: '#/definitions/TrelloHttpImportError'
              - type: string
- target: $.definitions
  description: Wekan v12.57 commit 647cbd111f43b4c936af2e03480f04cb8e2ef39e. Auth routes, startupSchemaUpgrade.js
    and importTrelloZip.js define these explicit request and response objects for the omitted operations.
  update:
    ErrorResponse:
      type: object
      additionalProperties: false
      description: Complete shared error fields serialized by Wekan v12.57 REST routes and Meteor.Error. Individual
        routes return subsets of these fields.
      properties:
        isClientSafe:
          type: boolean
        error:
          description: Error identifier. Authentication routes can return either a string identifier or a numeric
            Meteor.Error code.
          x-oneOf:
          - type: string
          - type: number
        reason:
          type: string
        message:
          type: string
        errorType:
          type: string
        statusCode:
          type: integer
          format: int32
        success:
          type: boolean
    LogoutRequest:
      type: object
      properties:
        all:
          description: true, numeric 1, or trimmed case-insensitive strings true/1/yes revoke all sessions. Every
            other JSON value selects only the presented token.
          x-anyOf:
          - type: boolean
          - type: number
          - type: string
          - type: array
            items: {}
          - type: object
            additionalProperties: true
          x-nullable: true
    LogoutResponse:
      type: object
      additionalProperties: false
      description: Logout success body from server/apiAuthRoutes.js lines 226-232.
      required:
      - message
      properties:
        message:
          type: string
    SchemaUpgradeLastCheck:
      type: object
      description: Previous successful version check stored by Wekan v12.57 server/lib/schemaUpgradeSteps.js lines
        949-958.
      required:
      - version
      - at
      properties:
        version:
          type: string
        at:
          type: string
          format: date-time
      additionalProperties: false
    SchemaUpgradeState:
      type: object
      description: Live upgrade state initialized by Wekan v12.57 server/lib/schemaUpgradeSteps.js lines 95-117
        and serialized by server/startupSchemaUpgrade.js lines 32-37.
      required:
      - running
      - product
      - appVersion
      - currentStep
      - gated
      - steps
      - startedAt
      - finishedAt
      - lastCheck
      properties:
        running:
          type: boolean
        product:
          type: string
        appVersion:
          type: string
        startedAt:
          type: string
          format: date-time
          x-nullable: true
        finishedAt:
          type: string
          format: date-time
          x-nullable: true
        currentStep:
          type: string
        gated:
          type: boolean
        steps:
          type: object
          additionalProperties:
            $ref: '#/definitions/SchemaUpgradeStepState'
        lastCheck:
          allOf:
          - $ref: '#/definitions/SchemaUpgradeLastCheck'
          x-nullable: true
      additionalProperties: false
    SchemaUpgradeStepState:
      type: object
      description: Per-step status populated by Wekan v12.57 server/lib/schemaUpgradeSteps.js lines 104-117 and
        908-941.
      required:
      - status
      - fixed
      - unresolved
      properties:
        status:
          type: string
          enum:
          - pending
          - checking
          - running
          - done
          - skipped
          - error
        fixed:
          type: integer
          format: int32
        unresolved:
          type: integer
          format: int32
        error:
          type: string
      additionalProperties: false
    TrelloHttpImportError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: string
    TrelloHttpImportJsonRequest:
      type: object
      additionalProperties: true
      required:
      - board
      properties:
        board:
          type: object
          additionalProperties: true
          description: Trello board export consumed by TrelloCreator.
        membersMapping:
          type: object
          additionalProperties:
            type: string
          description: Optional mapping from Trello member IDs to Wekan user IDs; defaults to {}.
    TrelloHttpImportRequest:
      description: 'Select the representation by Content-Type: application/json uses {board,membersMapping}; application/zip
        sends raw archive bytes. The route treats every non-JSON content type as a ZIP stream. Swagger 2.0 represents
        these media-dependent alternatives with x-oneOf.'
      x-oneOf:
      - $ref: '#/definitions/TrelloHttpImportJsonRequest'
      - type: string
        format: binary
    TrelloHttpImportResult:
      type: object
      additionalProperties: false
      required:
      - boardIds
      properties:
        boardIds:
          type: array
          items:
            type: string
          description: IDs of successfully created boards; may be empty.
        errors:
          type: array
          description: Present only for ZIP imports, including an empty array when all boards succeed.
          items:
            type: object
            additionalProperties: false
            required:
            - board
            - error
            properties:
              board:
                description: Original failed ZIP board.name value; not type-validated before error reporting.
              error:
                type: string
- target: $.securityDefinitions
  description: Wekan v12.57 commit 647cbd111f43b4c936af2e03480f04cb8e2ef39e. server/routes/importTrelloZip.js accepts
    X-Auth-Token or login cookies as alternatives to Bearer authentication; server/apiMiddleware.js 93-95 retains
    the access_token query fallback.
  update:
    TrelloImportXAuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Login token alternative for POST /import-trello.
    TrelloImportLoginCookie:
      type: apiKey
      in: header
      name: Cookie
      description: Login token cookie for POST /import-trello, sent as meteor_login_token=<token> or wekan_login_token=<token>.
        Bearer authentication takes precedence, then X-Auth-Token, then meteor_login_token, then wekan_login_token.
    AccessTokenSecurity:
      type: apiKey
      in: query
      name: access_token
      description: Global fallback login token when no Bearer token was parsed. Prefer the Authorization header
        to avoid credentials in URLs.
- target: $["definitions"]["UsersProfile"]["properties"]["collapsedCards"]
  description: Wekan v12.57 commit 647cbd111f43b4c936af2e03480f04cb8e2ef39e. models/users.js defines this view-state
    map; fresh live GET /api/user returns an empty object. Per-entry types follow setCollapsedCard and markCardViewed.
  remove: true
- target: $["definitions"]["UsersProfile"]["properties"]
  description: Wekan v12.57 commit 647cbd111f43b4c936af2e03480f04cb8e2ef39e. Map the typed dynamic view-state values
    from models/users.js.
  update:
    collapsedCards:
      type: object
