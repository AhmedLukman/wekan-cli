- target: $
  description: 'Native registrations omitted from upstream Swagger. Wekan v13.28 commit 9da7639123bc87dac6451d423f1400aa007774a7:
    server/bots.js, server/emailBounces.js, server/routes/inboundEmail.js and server/routes/exportAllBoards.js.
    Provider hooks preserve their native bytes and signature gates. Live verification is recorded by the native-hooks
    and export suites.'
  update:
    paths:
      /api/boards/{board}/cards/{card}/bot-runs/{run}:
        post:
          operationId: report_card_bot_run
          tags:
          - Native extensions
          summary: Report native bot run progress or completion
          parameters:
          - name: board
            in: path
            required: true
            type: string
          - name: card
            in: path
            required: true
            type: string
          - name: run
            in: path
            required: true
            type: string
          - name: body
            in: body
            required: true
            schema:
              type: object
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum:
                  - queued
                  - running
                  - awaiting_input
                  - review
                  - done
                  - failed
                  - stopped
                text:
                  type: string
                tool:
                  type: string
                question:
                  type: string
                options:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      value:
                        type: string
                      label:
                        type: string
                    required:
                    - value
                tokens:
                  type: number
                  minimum: 0
                  maximum: 1000000000000.0
                costUsd:
                  type: number
                  minimum: 0
                  maximum: 1000000000000.0
              required: []
          responses:
            '200':
              description: Native completion response
              schema:
                type: object
                additionalProperties: false
                properties:
                  _id:
                    type: string
                  status:
                    type: string
                    enum:
                    - queued
                    - running
                    - awaiting_input
                    - review
                    - done
                    - failed
                    - stopped
                required:
                - _id
                - status
          x-wekan-source: https://github.com/wekan/wekan/blob/v13.28/server/bots.js
          consumes:
          - application/json
      /api/inbound-email:
        post:
          operationId: submit_inbound_email
          tags:
          - Native extensions
          summary: Submit a provider payload or original RFC822 message
          parameters:
          - name: body
            in: body
            required: true
            schema:
              type: string
          responses:
            '200':
              description: Native completion response
              schema:
                type: object
                additionalProperties: false
                properties:
                  _id:
                    type: string
                    x-nullable: true
                required:
                - _id
          x-wekan-source: https://github.com/wekan/wekan/blob/v13.28/server/routes/inboundEmail.js
          consumes:
          - application/json
          - application/x-www-form-urlencoded
          - multipart/form-data
          - message/rfc822
      /api/inbound-email/ses:
        post:
          operationId: submit_ses_notification
          tags:
          - Native extensions
          summary: Submit an original signed SNS message
          responses:
            '200':
              description: Native successful response.
              schema:
                type: object
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
                required:
                - ok
          x-wekan-source: https://github.com/wekan/wekan/blob/v13.28/server/emailBounces.js
          consumes:
          - application/json
          - text/plain
          parameters:
          - name: body
            in: body
            required: true
            schema:
              type: string
              format: binary
              description: Unchanged provider payload bytes.
          description: Native AWS SES/SNS notification endpoint. Requires a genuine AWS SNS signature. Intentionally
            excluded from typed CLI support.
          x-cli-excluded: true
          x-cli-exclusion-reason: Amazon SES/SNS integration is intentionally excluded from typed CLI support.
      /api/inbound-email/bounces/{provider}:
        post:
          operationId: submit_email_bounce
          tags:
          - Native extensions
          summary: Submit an original signed provider bounce payload
          parameters:
          - name: provider
            in: path
            required: true
            type: string
            enum:
            - mailgun
            - sendgrid
            - postmark
            - brevo
            - mailjet
            - sparkpost
            - mandrill
            - resend
          - name: body
            in: body
            required: true
            schema:
              type: string
          responses:
            '200':
              description: Native completion response
              schema:
                type: object
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
                  recorded:
                    type: integer
                    minimum: 0
                required:
                - ok
                - recorded
          x-wekan-source: https://github.com/wekan/wekan/blob/v13.28/server/emailBounces.js
          consumes:
          - application/json
          - application/x-www-form-urlencoded
      /api/export-all-boards/{format}:
        get:
          operationId: export_all_boards
          tags:
          - Native extensions
          summary: Export eligible boards in one ZIP or Excel workbook
          parameters:
          - name: format
            in: path
            required: true
            type: string
            enum:
            - wekan
            - csv
            - scsv
            - tsv
            - excel
            - deck
            - kanboard
            - openproject
            - github
            - gitea
            - forgejo
            - gitlab
            - trello
            - jira
            - asana
            - zenkit
            - markdown
            - leo
            - todotxt
            - taskwarrior
            - focalboard
            - todoist
            - planner
            - meistertask
            - obsidian
            - linear
            - ticktick
            - clickup
            - nullboard
            - kanri
            - pivotal
            - redmine
            - tasksorg
            - monday
            - businessmap
            - superproductivity
            - taiga
            - vikunja
            - wrike
            - wrikeworkflow
            - teamwork
            - quire
            - notion
            - opml
            - orgmode
          - name: boardIds
            in: query
            type: string
          - name: fields
            in: query
            type: string
          - name: attachments
            in: query
            type: boolean
          - name: authToken
            in: query
            type: string
          responses:
            '200':
              description: Native completion response
              schema:
                type: file
          x-wekan-source: https://github.com/wekan/wekan/blob/v13.28/server/routes/exportAllBoards.js
          produces:
          - application/zip
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
