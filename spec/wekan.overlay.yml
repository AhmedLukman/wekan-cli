  description: 'Wekan v13.28: server/routes/importUpload.js and server/lib/importUpload.js.'
  update:
    /api/import/upload/{source}:
      post:
        tags:
        - Boards
        operationId: upload_import
        summary: Stage a source file for import
        description: Streams the file to temporary storage and returns a receipt. The REST board import route
          does not consume this upload ID.
        consumes:
        - application/octet-stream
        produces:
        - application/json
        security:
        - UserSecurity: []
        parameters:
