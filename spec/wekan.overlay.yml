  - target: '$.definitions'
    description: >-
      Add request schemas for mutation fields hidden from the upstream generator
      by awaits, helper calls, loops, computed keys, and nested JSON values.
    update:
      CardCreateRequest:
        type: object
        description: >-
          Card-create fields from the board/list-scoped POST handler in Wekan
          v11.06 server/models/cards.js. The handler reads parentId from a
          nonexistent route parameter, so a parentId request property would be
          silently ignored and is intentionally excluded. Title is required for
          ordinary cards. When linkedId is present, Wekan returns from its
          linked-card branch before reading title, so title is optional for that
          alternate request body.
        required: [swimlaneId]
        properties:
          title: {type: string}
          description: {type: string}
          swimlaneId: {type: string}
          linkedId: {type: string}
          members: {type: array, items: {type: string}}
          assignees: {type: array, items: {type: string}}
          receivedAt: {type: string, format: date-time}
          startAt: {type: string, format: date-time}
          dueAt: {type: string, format: date-time}
          endAt: {type: string, format: date-time}
      CardUpdateRequest:
        type: object
        description: >-
          Partial update fields from server/models/cards.js lines 1313-1700:
          ordinary fields 1327-1513, moves 1515-1635, archive/completion
          1636-1656, and stickers/locations 1658-1692. Empty date strings clear
          the corresponding date.
        properties:
          title:
            type: string
            description: >-
              Wekan truncates this value to the first 1000 JavaScript UTF-16
              code units.
          sort:
            type: number
            description: Wekan v11.06 tests this value for truthiness, so zero is silently ignored.
          parentId: {type: string}
          description: {type: string}
          color: {type: string}
          vote: {type: object, additionalProperties: true}
          poker: {type: object, additionalProperties: true}
          labelIds: {type: array, items: {type: string}}
          requestedBy: {type: string}
          assignedBy: {type: string}
          receivedAt: {type: string}
          startAt: {type: string}
          dueAt: {type: string}
          endAt: {type: string}
          spentTime:
            type: number
            description: Wekan v11.06 tests this value for truthiness, so zero is silently ignored.
          isOverTime:
            type: boolean
            description: >-
              Wekan v11.06 tests this value for truthiness and targets
              isOverTime, while the card schema field is isOvertime. False is
              ignored; true is acknowledged without changing the modeled
              isOvertime field in the pinned live stack.
          customFields: {type: array, items: {type: object, additionalProperties: true}}
          members: {type: array, items: {type: string}}
          assignees: {type: array, items: {type: string}}
          swimlaneId: {type: string}
          listId: {type: string}
          newBoardId: {type: string}
          newSwimlaneId: {type: string}
          newListId: {type: string}
          archive: {type: boolean}
          dueComplete: {type: boolean}
          stickers: {type: array, items: {type: object, additionalProperties: true}}
          locations: {type: array, items: {type: object, additionalProperties: true}}
      CardCopyRequest:
        type: object
        description: >-
          Card copy destinations and position from server/models/cards.js lines
          2080-2123; only toSwimlaneId is required.
        required: [toSwimlaneId]
        properties:
          toBoardId: {type: string}
          toSwimlaneId: {type: string}
          toListId: {type: string}
          position: {type: integer, minimum: 0}
      ChecklistCreateRequest:
        type: object
        description: >-
          Checklist title and item titles from server/models/checklists.js lines
          242-291.
        required: [title]
        properties:
          title: {type: string}
          items: {type: array, items: {type: string}}
      ChecklistItemCreateRequest:
        type: object
        description: >-
          Checklist-item title and optional sort from
          server/models/checklistItems.js lines 123-163.
        required: [title]
        properties:
          title: {type: string}
          sort: {type: number}
      ChecklistItemUpdateRequest:
        type: object
        description: >-
          Partial item fields from server/models/checklistItems.js lines
          177-227.
        properties:
          title: {type: string}
          isFinished: {type: boolean}
      CommentCreateRequest:
        type: object
        description: >-
          Required comment body validated and inserted by
          server/models/cardComments.js lines 144-174.
        required: [comment]
        properties:
          comment: {type: string, minLength: 1}
      CustomFieldRequest:
        type: object
        description: >-
          Custom-field create fields from server/models/customFields.js lines
          130-143 and partial update fields from lines 173-211.
        properties:
          name: {type: string}
          type: {type: string}
          settings: {type: object, additionalProperties: true}
          showOnCard: {type: boolean}
          automaticallyOnCard: {type: boolean}
          alwaysOnCard: {type: boolean}
          showLabelOnMiniCard: {type: boolean}
          showSumAtTopOfList: {type: boolean}
      IntegrationCreateRequest:
        type: object
        description: >-
