          - linear
          - ticktick
          - clickup
          - nullboard
          - kanri
          - pivotal
          - redmine
          - tasksorg
          - monday
          - superproductivity
          - taiga
          - vikunja
          - wrike
          - teamwork
          - businessmap
          - quire
          - notion
          - fizzy
          - plane
          - mail
          - ical
          - googletakeout
          - slack
          - mattermost
          - telegram
          - whatsapp
          - discord
          - rocketchat
          - evernote
          - sandstormwekan
          - sandstormprioritize
          - sandstormyatl
          - sandstormmutodo
          - sandstormsandchat
          - sandstormethercalc
          - sandstormradicalecalendar
          - sandstormradicalecontacts
          - sandstormdavros
          - sandstormhackercms
          - sandstormgogs
          - wordpress
          - wordpressjson
          - ghost
          - blogger
          - markdownsite
          - htmlsite
          - substack
          - sandstormwordpress
          - planka
          - mstodo
          - onenote
          - teams
          - kanbanflow
          - basecamp
          - googletasks
          - googlekeep
        - in: body
          name: file
          required: true
          schema:
            type: string
            format: binary
        responses:
          '200':
            description: File staged
            schema:
              type: object
              additionalProperties: false
              properties:
                uploadId:
                  type: string
                  pattern: ^[0-9a-f]{32}$
                size:
                  type: integer
                  format: int64
                  minimum: 0
              required:
              - uploadId
              - size
          '400':
            description: Invalid upload
          '401':
            description: Authentication required
          '403':
            description: Imports disabled
          '404':
            description: Unknown import source
          '413':
            description: Upload exceeds server limit
          '507':
            description: Insufficient disk space
