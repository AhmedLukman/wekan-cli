[package]
name = "wekan-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
description = "Agent-first, human-friendly command-line client for Wekan"
default-run = "wekan"
homepage = "https://github.com/AhmedLukman/wekan-cli"
repository = "https://github.com/AhmedLukman/wekan-cli"
readme = "README.md"
keywords = ["wekan", "cli", "kanban", "automation", "productivity"]
categories = ["command-line-utilities"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[[bin]]
name = "wekan"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
directories = "6.0.0"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream", "system-proxy"] }
rpassword = "7.5.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7.18", features = ["io"] }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.3"
wiremock = "0.6.5"

[profile.dist]
inherits = "release"
lto = "thin"
