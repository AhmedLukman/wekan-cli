[package]
name = "wekan-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Agent-first, human-friendly command-line client for Wekan"
default-run = "wekan"

[[bin]]
name = "wekan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "system-proxy"] }
rpassword = "7.5.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.3"
wiremock = "0.6.5"
